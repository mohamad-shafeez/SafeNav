<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In | SafeNav</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SafeNav">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="icon" href="assets/icon-192.png" type="image/png">

    <!-- Preconnect for speed -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/auth.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js" defer></script>
    <script src="js/firebase.js" defer></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(r => console.log('✅ SW:', r.scope))
                    .catch(e => console.warn('SW fail', e));
            });
        }
    </script>
</head>
<body class="auth-body" data-theme="dark">

    <canvas id="animated-bg" class="animated-bg"></canvas>

    <div id="authLoader" class="auth-loader">
        <div class="loader-inner">
            <div class="loader-ring"></div>
            <div class="loader-logo"><i class="fas fa-shield-alt"></i></div>
        </div>
    </div>

    <div class="auth-container glass-panel">
        <div class="auth-header">
            <div class="auth-logo pulse-logo"><i class="fas fa-shield-alt"></i></div>
            <h2 class="brand-title">Safe<span class="brand-accent">Nav</span></h2>
            <p class="brand-subtitle">Secure Travel Ecosystem</p>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" class="travel-form">
            <div class="form-group floating-group">
                <input type="email" id="loginEmail" class="floating-input" placeholder=" " required autocomplete="email">
                <label for="loginEmail" class="floating-label"><i class="fas fa-envelope"></i> Email Address</label>
            </div>

            <div class="form-group floating-group">
                <input type="password" id="loginPassword" class="floating-input" placeholder=" " required autocomplete="current-password">
                <label for="loginPassword" class="floating-label"><i class="fas fa-lock"></i> Password</label>
                <span class="toggle-password" data-target="loginPassword">👁️</span>
                <div class="password-strength"><div class="strength-bar"></div></div>
            </div>

            <div class="forgot-row">
                <a href="#" id="showForgotBtn" class="forgot-link"><i class="fas fa-key"></i> Forgot Password?</a>
            </div>

            <button type="submit" class="auth-btn shimmer-btn" id="loginBtn">
                <span class="btn-content"><span>Sign In</span> <i class="fas fa-arrow-right"></i></span>
                <div class="shimmer"></div>
            </button>

            <div class="divider"><span>or continue with</span></div>

            <button type="button" class="google-btn" onclick="handleGoogleLogin()">
                <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z"/>
                </svg>
                <span>Continue with Google</span>
            </button>

            <p class="toggle-text">Don't have an account? <a href="signup.html" class="toggle-link">Create one</a></p>
        </form>

        <!-- FORGOT PASSWORD FORM -->
        <form id="forgotForm" class="travel-form" style="display:none;">
            <div class="forgot-header">
                <i class="fas fa-unlock-alt forgot-icon"></i>
                <h3>Reset Password</h3>
                <p>Enter your email — we'll send a reset link instantly.</p>
            </div>
            <div class="form-group floating-group">
                <input type="email" id="resetEmail" class="floating-input" placeholder=" " required autocomplete="email">
                <label for="resetEmail" class="floating-label"><i class="fas fa-envelope"></i> Email Address</label>
            </div>
            <button type="submit" class="auth-btn shimmer-btn" id="resetBtn">
                <span class="btn-content"><span>Send Reset Link</span> <i class="fas fa-paper-plane"></i></span>
                <div class="shimmer"></div>
            </button>
            <p class="toggle-text" style="margin-top:16px;">
                <a href="#" id="showLoginBtn" class="toggle-link"><i class="fas fa-arrow-left"></i> Back to Sign In</a>
            </p>
        </form>

        <div id="authMessage" class="auth-message"></div>
    </div>

    <script src="js/bg-canvas.js" defer></script>
    <script src="js/auth.js" defer></script>
</body>
</html>
